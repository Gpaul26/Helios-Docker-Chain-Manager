version: '3.8'

services:
  helios-node:
    image: heliosnetwork/helios-node:1.2.3
    container_name: helios-node
    environment:
      - NODE_ENV=production
    volumes:
      - helios-data:/data
    ports:
      - "9944:9944"
    networks:
      - helios-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9944/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  helios-explorer:
    image: heliosnetwork/helios-explorer:1.0.0
    container_name: helios-explorer
    environment:
      - API_URL=http://helios-node:9944
    ports:
      - "8080:8080"
    networks:
      - helios-network
    depends_on:
      helios-node:
        condition: service_healthy
    restart: unless-stopped

volumes:
  helios-data:
    name: helios-data

networks:
  helios-network:
    driver: bridge
